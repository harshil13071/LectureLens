openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lecture-lens
    description: Transcript-based study tools
  - name: research
    description: Web research operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /study-notes:
    post:
      operationId: generateStudyNotes
      tags: [lecture-lens]
      summary: Generate study notes from a lecture transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyNotesInput"
      responses:
        "200":
          description: Generated study notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyNotes"
        "400":
          description: Invalid transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: AI provider rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: AI provider request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /quiz:
    post:
      operationId: generateQuiz
      tags: [lecture-lens]
      summary: Generate a custom practice quiz from study material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "200":
          description: Generated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "400":
          description: Invalid transcript or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: AI provider rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: AI provider request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /quiz/evaluate-answer:
    post:
      operationId: evaluateShortAnswer
      tags: [lecture-lens]
      summary: Evaluate a student short answer against the expected answer and rubric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateAnswerInput"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateAnswerResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evaluation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /extract-text:
    post:
      operationId: extractDocumentText
      tags: [lecture-lens]
      summary: Extract text from uploaded document (TXT, PDF, DOCX)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractDocumentTextInput"
      responses:
        "200":
          description: Extracted text and metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedTextResult"
        "400":
          description: Unsupported or invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Extraction failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ask:
    post:
      operationId: askLecture
      tags: [lecture-lens]
      summary: Answer a question with optional lecture context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LectureQuestionInput"
      responses:
        "200":
          description: AI tutor answer with transcript context when provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LectureAnswer"
        "400":
          description: Invalid transcript or question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: AI provider rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: AI provider request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /research:
    post:
      operationId: researchTopic
      tags: [research]
      summary: Perform AI topic research with live web search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchInput"
      responses:
        "200":
          description: Synthesised research with source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResult"
        "400":
          description: Invalid research query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Web search or AI synthesis failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: Research timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudyNotesInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        transcript:
          type: string
          minLength: 1
          maxLength: 40000
        youtubeUrl:
          type: string
          maxLength: 2048
      required:
        - transcript
    QuizInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        transcript:
          type: string
          minLength: 1
          maxLength: 40000
        questionType:
          type: string
          enum: [mcq, short_answer, mixed]
          default: mcq
        questionCount:
          type: integer
          minimum: 1
          maximum: 30
          default: 5
        difficulty:
          type: string
          enum: [easy, medium, hard, mixed]
          default: medium
      required:
        - transcript
    EvaluateAnswerInput:
      type: object
      properties:
        question:
          type: string
        studentAnswer:
          type: string
        expectedAnswer:
          type: string
        keyPoints:
          type: array
          items:
            type: string
      required:
        - question
        - studentAnswer
        - expectedAnswer
    EvaluateAnswerResponse:
      type: object
      properties:
        isCorrect:
          type: boolean
        score:
          type: number
        feedback:
          type: string
        whatYouGotRight:
          type: array
          items:
            type: string
        whatYouMissed:
          type: array
          items:
            type: string
      required:
        - isCorrect
        - score
        - feedback
        - whatYouGotRight
        - whatYouMissed
    ExtractDocumentTextInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file
    ExtractedTextResult:
      type: object
      properties:
        filename:
          type: string
        fileType:
          type: string
        textLength:
          type: integer
        text:
          type: string
        warning:
          type: string
      required:
        - filename
        - fileType
        - textLength
        - text
    LectureQuestionInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        transcript:
          type: string
          maxLength: 40000
          description: Optional lecture transcript used as supporting context.
        conversation:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/ConversationMessage"
        question:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - question
    ConversationMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000
      required:
        - role
        - content
    StudyNotes:
      type: object
      properties:
        overview:
          type: string
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicNotes"
        keyConcepts:
          type: array
          items:
            $ref: "#/components/schemas/KeyConcept"
        takeaways:
          type: array
          items:
            type: string
        quickRevision:
          type: string
      required:
        - overview
        - topics
        - keyConcepts
        - takeaways
        - quickRevision
    TopicNotes:
      type: object
      properties:
        title:
          type: string
        notes:
          type: array
          items:
            type: string
      required:
        - title
        - notes
    KeyConcept:
      type: object
      properties:
        term:
          type: string
        definition:
          type: string
      required:
        - term
        - definition
    Quiz:
      type: object
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/QuizQuestion"
        revisionSuggestions:
          type: array
          items:
            type: string
      required:
        - questions
    QuizQuestion:
      type: object
      properties:
        type:
          type: string
          enum: [mcq, short_answer]
          default: mcq
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
          minimum: 0
          maximum: 3
        expectedAnswer:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        explanation:
          type: string
      required:
        - question
        - explanation
    LectureAnswer:
      type: object
      properties:
        answer:
          type: string
        foundInTranscript:
          type: boolean
      required:
        - answer
        - foundInTranscript
    ResearchInput:
      type: object
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 500
        mode:
          type: string
          enum: [overview, detailed, exam_prep, comparison]
          default: overview
      required:
        - query
    ResearchSection:
      type: object
      properties:
        heading:
          type: string
        content:
          type: string
      required:
        - heading
        - content
    ResearchSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        snippet:
          type: string
      required:
        - title
        - url
    ResearchResult:
      type: object
      properties:
        topic:
          type: string
        mode:
          type: string
        overview:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ResearchSection"
        keyConcepts:
          type: array
          items:
            $ref: "#/components/schemas/KeyConcept"
        examples:
          type: array
          items:
            type: string
        uncertaintyNote:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ResearchSource"
      required:
        - topic
        - mode
        - overview
        - sections
        - keyConcepts
        - sources
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
        - code
